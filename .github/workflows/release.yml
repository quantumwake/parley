name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: GOFLAGS=-mod=vendor CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o statefs-ai_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} ./cmd/statefs-ai
      - run: gh release upload "${GITHUB_REF_NAME}" statefs-ai_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} --clobber || gh release create "${GITHUB_REF_NAME}" statefs-ai_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: GOFLAGS=-mod=vendor go test -race ./...
